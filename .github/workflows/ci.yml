name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m compileall -q .
      - name: Build the demo report (sample data)
        run: FTL_DEMO=1 python findthelaptop.py --consented --quick
      - name: Confirm the report was created
        run: ls Reports_demo/*.html
